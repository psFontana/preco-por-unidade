name: Monitoramento da aplicação
on:
  schedule:
    - cron: '31 5,11,17,23 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  health:
    name: Comparação na URL pública
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: https://psfontana.github.io/preco-por-unidade/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run monitor
      - name: Diagnóstico de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostico-monitor
          path: test-results/
          if-no-files-found: ignore
